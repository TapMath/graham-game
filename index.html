<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1214">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Grahan: a first-person search-and-survival game set in Mumbai, 2049. You are Mithi, blind, and you hear the city.">
  <title>Grahan</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <canvas id="game"></canvas>
  <!-- HUD container: src/ui/hud.js and the story systems mount their widgets in here. -->
  <div id="hud"><div id="crosshair"></div></div>
  <!-- Debug readout, only populated when ?debug=1 -->
  <pre id="debug-hud" hidden></pre>
  <!-- Title / pause / settings shell, driven by src/ui/overlay.js. The title is static so it is on screen while the city builds. -->
  <div id="overlay" class="loading" data-screen="title" data-origin="title">
    <canvas id="title-canvas" aria-hidden="true"></canvas>
    <div class="ov-shade"></div>
    <section id="ov-title">
      <header class="brand">
        <p class="kicker">a real-time search and survival game</p>
        <h1 class="wordmark" aria-label="Grahan">
          <svg viewBox="0 0 620 150" role="img" aria-hidden="true" preserveAspectRatio="xMinYMid meet">
            <g class="wm-ghost"><text x="14" y="124" textLength="590" lengthAdjust="spacingAndGlyphs">GRAHAN</text></g>
            <text class="wm" x="10" y="120" textLength="590" lengthAdjust="spacingAndGlyphs">GRAHAN</text>
          </svg>
        </h1>
        <p class="tagline">the search for sunrise in 2049 Mumbai</p>
        <p class="scrawl">Children of the Sun</p>
      </header>
      <nav id="ov-menu" class="menu" aria-label="Main menu"></nav>
      <p id="ov-load" class="loadline"><i class="bar"></i><span>building the city</span></p>
      <p id="ov-phones" class="phones"><svg viewBox="0 0 28 24" aria-hidden="true"><path d="M4 16 V13 A10 10 0 0 1 24 13 V16"/><rect x="2.5" y="14.5" width="5" height="8" rx="2"/><rect x="20.5" y="14.5" width="5" height="8" rx="2"/></svg><span>Headphones recommended. Sound is how Mithi sees.</span></p>
    </section>
  </div>
  <div id="fatal" hidden></div>
  <!-- Boot watchdog (a classic script, so it runs even where the game's modules cannot): if the game has not started after
       a while, or an error escapes before it does, say so on screen instead of leaving "building the city" up forever. -->
  <script>
  (function () {
    var errs = [];
    function note(m) { if (m && errs.indexOf(m) < 0 && errs.length < 6) errs.push(String(m).slice(0, 300)); }
    window.addEventListener('error', function (e) { note(e.message || (e.target && e.target.src ? 'could not load ' + e.target.src : 'error')); setTimeout(function () { report(false); }, 4000); }, true);
    window.addEventListener('unhandledrejection', function (e) { note(e.reason && (e.reason.message || e.reason)); });
    function webgl2() { try { return !!document.createElement('canvas').getContext('webgl2'); } catch (x) { return false; } }
    function report(timeout) {
      if (window.__grahanBooted) return;
      if (!timeout && !errs.length) return;
      var el = document.getElementById('fatal');
      var lines = [timeout ? 'Grahan is taking too long to start.' : 'Grahan could not start.'];
      if (!webgl2()) lines.push('This browser has no WebGL 2, which the game needs. Please update to a recent iOS/iPadOS, Safari, Chrome or Firefox.');
      if (errs.length) lines.push('Error: ' + errs.join(' | '));
      lines.push(navigator.userAgent);
      el.textContent = lines.join('\n\n'); el.style.whiteSpace = 'pre-wrap'; el.hidden = false;
    }
    setTimeout(function () { report(true); }, 25000);
  })();
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
